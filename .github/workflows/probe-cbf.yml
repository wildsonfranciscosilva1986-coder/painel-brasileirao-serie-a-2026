name: Probe official CBF source access

on:
  workflow_dispatch:
  repository_dispatch:
    types: [probe-cbf]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - name: Inspect official CBF pages from GitHub runner
        run: python probe_cbf.py
