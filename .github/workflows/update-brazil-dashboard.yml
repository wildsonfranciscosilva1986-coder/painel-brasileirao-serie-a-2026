name: Validate and publish Brasileirão Série A dashboard

on:
  schedule:
    - cron: '10 9 * * *' # 06:10 America/Sao_Paulo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brasileirao-serie-a-dashboard-production
  cancel-in-progress: false

jobs:
  validate-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify and trust only the pinned CBF intermediate
        run: |
          actual="$(openssl x509 -in certs/sectigo-ov-r36.pem -noout -fingerprint -sha256 | sed 's/.*=//')"
          expected='65:42:D1:76:BE:D5:0F:19:3C:0C:E2:97:AE:44:EC:D8:A0:A8:6B:EC:2E:DE:68:27:69:34:40:59:B4:E7:85:30'
          test "$actual" = "$expected"
          sudo install -m 0644 certs/sectigo-ov-r36.pem /usr/local/share/ca-certificates/cbf-sectigo-ov-r36.crt
          sudo update-ca-certificates
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Collect CBF data and complete all independent checks
        run: python collect_validate.py
      - name: Build dashboard only from passing validation output
        run: python build_validated_dashboard.py
      - name: Preserve validation and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brasileirao-serie-a-production-${{ github.run_id }}
          path: |
            validation-output/
            index.html
            serie_a_2026_results_verified.csv
          if-no-files-found: warn
          retention-days: 30
      - name: Commit validated dashboard to the existing Pages source
        run: |
          git diff --check
          if git diff --quiet -- index.html; then
            echo 'Validated dashboard is byte-identical to main/index.html; no publication commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "Atualiza painel Série A após validação CBF/ESPN"
          git push origin HEAD:main
